name: probe ictool
on: [push, workflow_dispatch]
concurrency:
  group: probe-${{ github.run_id }}
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Select Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Probe ictool and actool CLIs
        shell: bash
        run: |
          IC=/Applications/Xcode_26.6.app/Contents/Developer/usr/bin/ictool
          echo "=== ictool bad-arg (usage) ==="
          "$IC" --bogus 2>&1 | head -60 || true
          echo "=== ictool version ==="
          "$IC" --version 2>&1 | head -8 || true
          echo "=== actool help ==="
          xcrun actool --help 2>&1 | head -140 || true
          echo "=== try ictool IR export again (verbose) ==="
          "$IC" Assets/AppIcon.icon --export-intermediate-representation --output-directory /tmp/probe-ir --platform macOS 2>&1 | head -40 || true
          echo "=== try actool on .icon directly ==="
          mkdir -p /tmp/probe-out
          xcrun actool Assets/AppIcon.icon --compile /tmp/probe-out --platform macosx --minimum-deployment-target 26.0 --target-device mac --app-icon AppIcon --output-partial-info-plist /tmp/probe-out/p.plist 2>&1 | head -40 || true
          echo "=== out dir ==="
          ls -l /tmp/probe-out 2>/dev/null || true
          echo "=== probe done ==="
        id: probe
